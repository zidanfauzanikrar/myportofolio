<div id="edit-skill-modal"
     class="skill-form-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="edit-skill-modal-title">
    <button type="button"
            class="skill-form-modal__backdrop"
            popovertarget="edit-skill-modal"
            popovertargetaction="hide"
            aria-label="Tutup form edit skill"></button>

    <div class="skill-form-modal__content">
        <button type="button"
                class="skill-form-modal__close"
                popovertarget="edit-skill-modal"
                popovertargetaction="hide"
                aria-label="Tutup form edit skill">×</button>

        <h2 id="edit-skill-modal-title">Edit Skill</h2>
        <form id="skill-edit-form" class="skill-form">
            {% for field in edit_form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                </div>
            {% endfor %}
            <div class="skill-form-modal__actions">
                <button type="button"
                        class="button button-secondary"
                        popovertarget="edit-skill-modal"
                        popovertargetaction="hide">Batal</button>
                <button type="submit" class="button">Simpan Perubahan</button>
            </div>
        </form>
    </div>
</div>
